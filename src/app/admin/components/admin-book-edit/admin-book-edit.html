@if (!isEditMode()) {
  <h1>Nová kniha</h1>
  <app-book-form (saved)="save($event)" />
} @else if (book(); as book) {
  <h1>Úprava knihy</h1>
  <app-book-form [book]="book" (saved)="save($event)" (cancelled)="cancel()" />
} @else {
  <h1>Úprava knihy</h1>
  <p>Kniha s číslom {{ id() }} v knižnici neexistuje.</p>
  <button matButton="filled" type="button" (click)="cancel()">Späť na správu kníh</button>
}
